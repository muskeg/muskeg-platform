# ID du tunnel muskeg-platform (public : il apparaît déjà dans le CNAME DNS)
tunnel: 70628918-61c1-42c9-9d96-d885db96e136
credentials-file: /etc/cloudflared/creds/credentials.json
metrics: 0.0.0.0:2000
no-autoupdate: true

ingress:
  # Toujours en HTTPS vérifié vers Traefik, jamais de noTLSVerify
  - hostname: "*.muskeg.dev"
    service: https://traefik.traefik.svc.cluster.local:443
    originRequest:
      originServerName: muskeg.dev
  # À la bascule, ajouter l'apex muskeg.dev avec la même destination
  - service: http_status:404
