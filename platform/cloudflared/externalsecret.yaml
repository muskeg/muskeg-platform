apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudflared-credentials
  data:
    - secretKey: credentials.json
      remoteRef:
        key: cloudflared-tunnel/credentials
