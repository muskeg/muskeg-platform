apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: calico-cni-plugin-clusterinformation
rules:
  - apiGroups:
      - crd.projectcalico.org
    resources:
      - clusterinformations
    resourceNames:
      - default
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: calico-cni-plugin-clusterinformation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: calico-cni-plugin-clusterinformation
subjects:
  - kind: ServiceAccount
    name: calico-cni-plugin
    namespace: kube-system
