apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.32/deploy/local-path-storage.yaml
patches:
  - target:
      kind: Namespace
      name: local-path-storage
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: local-path-storage
        labels:
          # Les helper pods montent un hostPath pour créer les volumes.
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted
  - target:
      kind: StorageClass
      name: local-path
    patch: |-
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: local-path
      # Une suppression de PVC ne doit pas effacer les données.
      reclaimPolicy: Retain
  - target:
      kind: ConfigMap
      name: local-path-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: local-path-config
        namespace: local-path-storage
      data:
        config.json: |-
          {
            "nodePathMap": [
              {
                "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
                "paths": ["/var/mnt/local-path-provisioner"]
              }
            ]
          }
        helperPod.yaml: |-
          apiVersion: v1
          kind: Pod
          metadata:
            name: helper-pod
          spec:
            priorityClassName: system-node-critical
            tolerations:
              - key: node.kubernetes.io/disk-pressure
                operator: Exists
                effect: NoSchedule
            containers:
              - name: helper-pod
                image: busybox:1.37.0
                imagePullPolicy: IfNotPresent
  - target:
      kind: Deployment
      name: local-path-provisioner
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: local-path-provisioner
        namespace: local-path-storage
      spec:
        template:
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: local-path-provisioner
                resources:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { memory: 128Mi }
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
