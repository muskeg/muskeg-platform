# Un pod par node, exposé sur les ports 80/443 de chaque node pour le LAN
deployment:
  kind: DaemonSet

# Avec hostPort, un nouveau pod ne peut pas coexister avec l'ancien sur le même node
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443

# cloudflared passe par le service interne
service:
  type: ClusterIP

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
    # Le service ClusterIP n'a pas d'adresse à publier ; on publie l'IP virtuelle du LAN
    publishedService:
      enabled: false

additionalArguments:
  - --providers.kubernetesingress.ingressendpoint.ip=192.168.1.40

resources:
  requests: { cpu: 25m, memory: 48Mi }
  limits: { memory: 160Mi }
