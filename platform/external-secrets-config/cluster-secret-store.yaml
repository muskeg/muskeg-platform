apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: muskeg-platform
      auth:
        serviceAccountSecretRef:
          # Créé une seule fois par bootstrap.sh
          name: onepassword-token
          namespace: external-secrets
          key: token
