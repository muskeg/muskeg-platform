global:
  domain: argocd.k8s.muskegg.com

configs:
  params:
    # TLS terminé par Traefik avec le certificat wildcard
    server.insecure: true
  cm:
    # Un seul utilisateur, accessible sur le LAN seulement
    admin.enabled: true

dex:
  enabled: false

notifications:
  enabled: false

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 192Mi }

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

applicationSet:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }

redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }
