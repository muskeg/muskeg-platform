# k3s suit le canal stable, un node à la fois, la nuit
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: system-upgrade
spec:
  channel: https://update.k3s.io/v1-release/channels/stable
  concurrency: 1
  cordon: true
  serviceAccountName: system-upgrade
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  window:
    days: ["tuesday", "wednesday", "thursday"]
    startTime: "03:00"
    endTime: "05:00"
    timeZone: America/Toronto
  upgrade:
    image: rancher/k3s-upgrade
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: system-upgrade
spec:
  channel: https://update.k3s.io/v1-release/channels/stable
  concurrency: 1
  cordon: true
  serviceAccountName: system-upgrade
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  # Les agents attendent que le server soit à jour
  prepare:
    image: rancher/k3s-upgrade
    args: ["prepare", "k3s-server"]
  window:
    days: ["tuesday", "wednesday", "thursday"]
    startTime: "03:00"
    endTime: "05:00"
    timeZone: America/Toronto
  upgrade:
    image: rancher/k3s-upgrade
