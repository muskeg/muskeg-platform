# Le SDK 1Password dépasse 160 Mi dès le démarrage
resources:
  requests: { cpu: 10m, memory: 192Mi }
  limits: { memory: 512Mi }

webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }
  # cert-manager gère le certificat du webhook ; le cert-controller d'ESO brûlait ~1 CPU en continu
  certManager:
    enabled: true
    cert:
      issuerRef:
        group: cert-manager.io
        kind: Issuer
        name: external-secrets-selfsigned

certController:
  create: false

extraObjects:
  - apiVersion: cert-manager.io/v1
    kind: Issuer
    metadata:
      name: external-secrets-selfsigned
      namespace: external-secrets
    spec:
      selfSigned: {}
