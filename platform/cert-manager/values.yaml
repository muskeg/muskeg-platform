crds:
  enabled: true
  keep: true

# Résolution DNS publique pour la validation DNS-01, sans passer par le Pi-hole du LAN
dns01RecursiveNameservers: "1.1.1.1:53,9.9.9.9:53"
dns01RecursiveNameserversOnly: true

resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits: { memory: 160Mi }

webhook:
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }

cainjector:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }
