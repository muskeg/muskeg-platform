name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: site
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/muskeg/muskeg-site

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et publication de l'image
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          docker buildx build site \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE}:${TAG}" \
            --push
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      # Le déploiement est un commit : Argo CD s'occupe du reste
      - name: Mise à jour du tag dans Git
        run: |
          yq -i '(.images[] | select(.name == strenv(IMAGE))).newTag = strenv(TAG)' apps/site/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "site: déploie ${TAG}"
          git pull --rebase
          git push
