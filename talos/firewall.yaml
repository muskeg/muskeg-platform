# Pare-feu des nodes, appliqué APRÈS que le cluster fonctionne :
#   talosctl -n 192.168.1.41,192.168.1.42,192.168.1.43 patch mc --mode=try --patch @talos/firewall.yaml
# --mode=try annule le changement après 1 minute si on perd l'accès.
apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: block
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: apid-lan
portSelector:
  ports: [50000]
  protocol: tcp
ingress:
  - subnet: 192.168.1.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: kubernetes-api
portSelector:
  ports: [6443]
  protocol: tcp
ingress:
  - subnet: 192.168.1.0/24
  # Les pods joignent l'API par le service kubernetes, qui pointe vers les nodes
  - subnet: 10.244.0.0/16
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: ingress-http
portSelector:
  ports: [80, 443]
  protocol: tcp
ingress:
  - subnet: 192.168.1.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: trustd-kubelet-etcd
portSelector:
  ports: [50001, 10250, 2379-2380]
  protocol: tcp
ingress:
  - subnet: 192.168.1.41/32
  - subnet: 192.168.1.42/32
  - subnet: 192.168.1.43/32
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: flannel-vxlan
portSelector:
  ports: [4789]
  protocol: udp
ingress:
  - subnet: 192.168.1.41/32
  - subnet: 192.168.1.42/32
  - subnet: 192.168.1.43/32
