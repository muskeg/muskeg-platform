# Pare-feu des nodes, appliqué APRÈS que le cluster fonctionne.
# --mode=try annule TOUJOURS à la fin du délai : tester, puis réappliquer sans --mode=try pour le garder.
#   talosctl -n <ip> patch mc --mode=try --timeout 5m --patch @talos/firewall.yaml
#   talosctl -n <ip> patch mc --patch @talos/firewall.yaml
apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: block
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: apid-lan
portSelector:
  ports: [50000]
  protocol: tcp
ingress:
  - subnet: 192.168.1.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: kubernetes-api
portSelector:
  ports: [6443]
  protocol: tcp
ingress:
  - subnet: 192.168.1.0/24
  # Les pods joignent l'API par le service kubernetes, qui pointe vers les nodes
  - subnet: 10.244.0.0/16
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: ingress-http
portSelector:
  ports: [80, 443]
  protocol: tcp
ingress:
  - subnet: 192.168.1.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: trustd-kubelet-etcd
portSelector:
  ports: [50001, 10250, 2379-2380]
  protocol: tcp
ingress:
  # .40 (VIP) à .43
  - subnet: 192.168.1.40/30
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: flannel-vxlan
portSelector:
  ports: [4789]
  protocol: udp
ingress:
  - subnet: 192.168.1.40/30
---
# CoreDNS transfère vers le DNS de l'hôte Talos (169.254.116.108)
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: host-dns-udp
portSelector:
  ports: [53]
  protocol: udp
ingress:
  - subnet: 10.244.0.0/16
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: host-dns-tcp
portSelector:
  ports: [53]
  protocol: tcp
ingress:
  - subnet: 10.244.0.0/16
