apiVersion: apps/v1
kind: Deployment
metadata:
  name: dendrite
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dendrite
  template:
    metadata:
      labels:
        app: dendrite
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dendrite
          image: ghcr.io/element-hq/dendrite-monolith:v0.15.2
          args:
            - --config
            - /etc/dendrite/dendrite.yaml
            - --http-bind-address
            - 0.0.0.0:8008
          ports:
            - name: http
              containerPort: 8008
          startupProbe:
            httpGet:
              path: /_matrix/client/versions
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: http
          livenessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: http
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/dendrite
              readOnly: true
            - name: data
              mountPath: /var/dendrite
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: dendrite-config
            items:
              - key: dendrite.yaml
                path: dendrite.yaml
              - key: matrix_key.pem
                path: matrix_key.pem
        - name: data
          persistentVolumeClaim:
            claimName: dendrite-data
        - name: tmp
          emptyDir: {}
