apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dendrite
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: matrix.muskeg.dev
      http:
        paths:
          - path: /_matrix
            pathType: Prefix
            backend:
              service:
                name: dendrite
                port:
                  name: http
          - path: /.well-known/matrix
            pathType: Prefix
            backend:
              service:
                name: dendrite
                port:
                  name: http
