apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site
  annotations:
    # Pas de secret TLS ici : Traefik utilise le certificat wildcard du TLSStore par défaut
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: muskeg.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: site
                port:
                  name: http
    - host: beta.muskeg.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: site
                port:
                  name: http
