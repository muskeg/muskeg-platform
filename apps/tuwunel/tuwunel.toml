[global]
server_name = "matrix.muskeg.dev"
database_path = "/var/lib/tuwunel"
address = ["0.0.0.0"]
port = 8008
allow_registration = false
allow_federation = true
registration_shared_secret_file = "/etc/tuwunel/secrets/registration-shared-secret"
grant_admin_to_first_user = false
new_user_displayname_suffix = ""
db_cache_capacity_mb = 128.0
db_write_buffer_capacity_mb = 48.0
log_colors = false
error_on_unknown_config_opts = true

[global.well_known]
client = "https://matrix.muskeg.dev"
server = "matrix.muskeg.dev:443"
# Activer après validation de la stack VPS vps/matrix-rtc.
