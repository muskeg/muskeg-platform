apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuwunel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tuwunel
  template:
    metadata:
      labels:
        app: tuwunel
    spec:
      automountServiceAccountToken: false
      # Éviter TUWUNEL_PORT injecté par le Service, interprété comme configuration.
      enableServiceLinks: false
      # Laisser les migrations atteindre un point sûr avant l'arrêt.
      terminationGracePeriodSeconds: 1800
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tuwunel
          image: ghcr.io/matrix-construct/tuwunel:v1.9.4
          env:
            - name: TUWUNEL_CONFIG
              value: /etc/tuwunel/config/tuwunel.toml
          ports:
            - name: http
              containerPort: 8008
          startupProbe:
            httpGet:
              path: /_matrix/client/versions
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: http
          livenessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: http
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/tuwunel/config
              readOnly: true
            - name: registration
              mountPath: /etc/tuwunel/secrets
              readOnly: true
            - name: data
              mountPath: /var/lib/tuwunel
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: tuwunel-config
        - name: registration
          secret:
            secretName: tuwunel-registration
        - name: data
          persistentVolumeClaim:
            claimName: tuwunel-data
        - name: tmp
          emptyDir: {}
