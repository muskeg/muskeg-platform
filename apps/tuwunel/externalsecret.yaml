apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuwunel-registration
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tuwunel-registration
  data:
    - secretKey: registration-shared-secret
      remoteRef:
        key: tuwunel/registration-shared-secret
