apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calico
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  sources:
    - repoURL: https://github.com/projectcalico/calico.git
      targetRevision: v3.33.0
      path: manifests
      directory:
        include: calico-policy-only.yaml
    - repoURL: https://github.com/muskeg/muskeg-platform.git
      targetRevision: main
      path: platform/calico
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
